name: Build and deploy Hugo previews to Pages

on:
  push:
    branches:
      - main
      - theme-universal
      - theme-arcana
    paths:
      - "hugo/**"
      - ".github/workflows/hugo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.166.0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout baseline
        uses: actions/checkout@v6
        with:
          ref: main
          path: baseline

      - name: Checkout Universal experiment
        uses: actions/checkout@v6
        with:
          ref: theme-universal
          path: universal

      - name: Checkout Arcana experiment
        uses: actions/checkout@v6
        with:
          ref: theme-arcana
          path: arcana

      - name: Install Hugo
        shell: bash
        run: |
          set -euxo pipefail
          curl -L             "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"             -o /tmp/hugo.tar.gz
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
          sudo install -m 0755 /tmp/hugo /usr/local/bin/hugo
          hugo version

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Prepare Universal theme
        shell: bash
        run: |
          set -euxo pipefail
          bash universal/hugo/tools/setup-universal-theme.sh

      - name: Prepare Arcana theme
        shell: bash
        run: |
          set -euxo pipefail
          bash arcana/hugo/tools/setup-arcana-theme.sh

      - name: Build baseline
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p publish
          hugo             --source ./baseline/hugo             --destination "${GITHUB_WORKSPACE}/publish"             --cleanDestinationDir             --minify             --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Build Universal preview
        shell: bash
        run: |
          set -euxo pipefail
          hugo             --source ./universal/hugo             --destination "${GITHUB_WORKSPACE}/publish/universal"             --cleanDestinationDir             --minify             --baseURL "${{ steps.pages.outputs.base_url }}/universal/"

      - name: Build Arcana preview
        shell: bash
        run: |
          set -euxo pipefail
          hugo             --source ./arcana/hugo             --destination "${GITHUB_WORKSPACE}/publish/arcana"             --cleanDestinationDir             --minify             --baseURL "${{ steps.pages.outputs.base_url }}/arcana/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./publish

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
