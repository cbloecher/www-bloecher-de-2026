name: Build and deploy Hugo theme previews to Pages

on:
  push:
    branches:
      - main
      - theme-universal
      - theme-arcana
      - theme-pico-corp
    paths:
      - "hugo/**"
      - "pages-preview/**"
      - ".github/workflows/hugo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.166.0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout baseline
        uses: actions/checkout@v6
        with:
          ref: main
          path: baseline

      - name: Checkout Universal experiment
        uses: actions/checkout@v6
        with:
          ref: theme-universal
          path: universal

      - name: Checkout Arcana experiment
        uses: actions/checkout@v6
        with:
          ref: theme-arcana
          path: arcana

      - name: Checkout Pico Corp experiment
        uses: actions/checkout@v6
        with:
          ref: theme-pico-corp
          path: pico-corp

      - name: Install Hugo Extended
        shell: bash
        run: |
          set -euxo pipefail
          curl -L             "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"             -o /tmp/hugo.tar.gz
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
          sudo install -m 0755 /tmp/hugo /usr/local/bin/hugo
          hugo version

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Prepare external themes
        shell: bash
        run: |
          set -euxo pipefail
          bash universal/hugo/tools/setup-universal-theme.sh
          bash arcana/hugo/tools/setup-arcana-theme.sh
          bash pico-corp/hugo/tools/setup-pico-corp-theme.sh

      - name: Prepare landing page
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf publish
          mkdir -p publish
          cp -a baseline/pages-preview/. publish/

      - name: Build Blöcher Custom preview
        shell: bash
        run: |
          set -euxo pipefail
          hugo             --source ./baseline/hugo             --destination "${GITHUB_WORKSPACE}/publish/bloecher-custom"             --cleanDestinationDir             --minify             --baseURL "${{ steps.pages.outputs.base_url }}/bloecher-custom/"

      - name: Build Universal preview
        shell: bash
        run: |
          set -euxo pipefail
          hugo             --source ./universal/hugo             --destination "${GITHUB_WORKSPACE}/publish/universal"             --cleanDestinationDir             --minify             --baseURL "${{ steps.pages.outputs.base_url }}/universal/"

      - name: Build Arcana preview
        shell: bash
        run: |
          set -euxo pipefail
          hugo             --source ./arcana/hugo             --destination "${GITHUB_WORKSPACE}/publish/arcana"             --cleanDestinationDir             --minify             --baseURL "${{ steps.pages.outputs.base_url }}/arcana/"

      - name: Build Pico Corp preview
        shell: bash
        run: |
          set -euxo pipefail
          hugo             --source ./pico-corp/hugo             --destination "${GITHUB_WORKSPACE}/publish/pico-corp"             --cleanDestinationDir             --minify             --baseURL "${{ steps.pages.outputs.base_url }}/pico-corp/"

      - name: Verify preview output
        shell: bash
        run: |
          set -euxo pipefail
          test -s publish/index.html
          test -s publish/bloecher-custom/index.html
          test -s publish/universal/index.html
          test -s publish/arcana/index.html
          test -s publish/pico-corp/index.html
          test -s publish/pico-corp/en/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./publish

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
