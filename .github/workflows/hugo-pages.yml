name: Build and deploy Hugo theme previews to Pages

on:
  push:
    branches:
      - main
      - "theme-*"
    paths:
      - "hugo/**"
      - "pages-preview/**"
      - ".github/workflows/hugo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.166.0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout orchestration
        uses: actions/checkout@v6
        with:
          ref: main
          path: orchestration

      - name: Checkout Blöcher Custom development
        uses: actions/checkout@v6
        with:
          ref: theme-bloecher-custom
          path: bloecher-custom

      - name: Checkout production site
        uses: actions/checkout@v6
        with:
          ref: main
          path: pico-corp

      - name: Install Hugo Extended
        shell: bash
        run: |
          set -euxo pipefail
          curl -L             "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"             -o /tmp/hugo.tar.gz
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
          sudo install -m 0755 /tmp/hugo /usr/local/bin/hugo
          hugo version

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Prepare external themes
        shell: bash
        run: |
          set -euxo pipefail
          bash pico-corp/hugo/tools/setup-pico-corp-theme.sh

      - name: Prepare landing page
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf publish
          mkdir -p publish
          cp -a orchestration/pages-preview/. publish/

      - name: Build Blöcher Custom preview
        shell: bash
        run: |
          set -euxo pipefail
          hugo             --source ./bloecher-custom/hugo             --destination "${GITHUB_WORKSPACE}/publish/bloecher-custom"             --cleanDestinationDir             --minify             --baseURL "${{ steps.pages.outputs.base_url }}/bloecher-custom/"

      - name: Build Pico Corp preview
        shell: bash
        run: |
          set -euxo pipefail
          hugo             --source ./pico-corp/hugo             --destination "${GITHUB_WORKSPACE}/publish/pico-corp"             --cleanDestinationDir             --minify             --baseURL "${{ steps.pages.outputs.base_url }}/pico-corp/"

      - name: Verify preview output
        shell: bash
        run: |
          set -euxo pipefail
          test -s publish/index.html
          test -s publish/bloecher-custom/index.html
          test -s publish/pico-corp/index.html
          test -s publish/pico-corp/en/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./publish

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
