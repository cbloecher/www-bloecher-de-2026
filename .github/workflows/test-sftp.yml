name: Test SFTP deployment connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-sftp:
    name: Test SFTP connection
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5

    steps:
      - name: Validate deployment configuration
        env:
          DEPLOY_SFTP_HOST: ${{ vars.DEPLOY_SFTP_HOST }}
          DEPLOY_SFTP_PORT: ${{ vars.DEPLOY_SFTP_PORT }}
          DEPLOY_SFTP_USER: ${{ vars.DEPLOY_SFTP_USER }}
          DEPLOY_SFTP_PATH: ${{ vars.DEPLOY_SFTP_PATH }}
          DEPLOY_SFTP_PASSWORD: ${{ secrets.DEPLOY_SFTP_PASSWORD }}
        run: |
          set -eu
          missing=0
          for name in DEPLOY_SFTP_HOST DEPLOY_SFTP_USER DEPLOY_SFTP_PATH DEPLOY_SFTP_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing configuration::${name} is empty or unavailable"
              missing=1
            fi
          done
          if [ -z "${DEPLOY_SFTP_PORT:-}" ]; then
            echo "::notice title=Default SFTP port::DEPLOY_SFTP_PORT is empty; port 22 will be used"
          fi
          test "$missing" -eq 0

      - name: Install SFTP client
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Test login and target directory
        env:
          DEPLOY_SFTP_HOST: ${{ vars.DEPLOY_SFTP_HOST }}
          DEPLOY_SFTP_PORT: ${{ vars.DEPLOY_SFTP_PORT }}
          DEPLOY_SFTP_USER: ${{ vars.DEPLOY_SFTP_USER }}
          DEPLOY_SFTP_PATH: ${{ vars.DEPLOY_SFTP_PATH }}
          DEPLOY_SFTP_PASSWORD: ${{ secrets.DEPLOY_SFTP_PASSWORD }}
        run: |
          set -eu
          port="${DEPLOY_SFTP_PORT:-22}"
          lftp -u "$DEPLOY_SFTP_USER","$DEPLOY_SFTP_PASSWORD" \
            -p "$port" \
            "sftp://$DEPLOY_SFTP_HOST" \
            -e "set sftp:auto-confirm yes; cd \"$DEPLOY_SFTP_PATH\"; pwd; cls -1; bye"
