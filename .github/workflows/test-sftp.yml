name: Test SFTP deployment connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-sftp:
    name: Test SFTP connection
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      DEPLOY_SFTP_HOST: ${{ vars.DEPLOY_SFTP_HOST || vars.DEPLOY_HOST }}
      DEPLOY_SFTP_PORT: ${{ vars.DEPLOY_SFTP_PORT || vars.DEPLOY_PORT }}
      DEPLOY_SFTP_USER: ${{ vars.DEPLOY_SFTP_USER || vars.DEPLOY_USER }}
      DEPLOY_SFTP_PATH: ${{ vars.DEPLOY_SFTP_PATH || vars.DEPLOY_PATH }}
      DEPLOY_SFTP_PASSWORD: ${{ secrets.DEPLOY_SFTP_PASSWORD || secrets.DEPLOY_PASSWORD }}

    steps:
      - name: Validate deployment configuration
        run: |
          set -eu
          : "${DEPLOY_SFTP_HOST:?Missing DEPLOY_SFTP_HOST or DEPLOY_HOST variable}"
          : "${DEPLOY_SFTP_USER:?Missing DEPLOY_SFTP_USER or DEPLOY_USER variable}"
          : "${DEPLOY_SFTP_PATH:?Missing DEPLOY_SFTP_PATH or DEPLOY_PATH variable}"
          : "${DEPLOY_SFTP_PASSWORD:?Missing DEPLOY_SFTP_PASSWORD or DEPLOY_PASSWORD secret}"

      - name: Install SFTP client
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Test login and target directory
        run: |
          set -eu
          port="${DEPLOY_SFTP_PORT:-22}"
          lftp -u "$DEPLOY_SFTP_USER","$DEPLOY_SFTP_PASSWORD" \
            -p "$port" \
            "sftp://$DEPLOY_SFTP_HOST" \
            -e "set sftp:auto-confirm yes; cd \"$DEPLOY_SFTP_PATH\"; pwd; cls -1; bye"
