{{ define "main" }}
<section class="page-list">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
  </header>
  {{ with .Content }}<div class="page-content">{{ . }}</div>{{ end }}
  {{ range .Pages }}
    <article>
      <h2><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
      {{ with .Description }}<p>{{ . }}</p>{{ end }}
    </article>
  {{ end }}
</section>
{{ end }}
