{{ define "main" }}
{{ partial "section-nav.html" . }}
<article class="page">
  <header class="page-header">
    {{ with .Parent }}
      {{ if not .IsHome }}<p class="eyebrow">{{ .Title }}</p>{{ end }}
    {{ end }}
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="page-lead">{{ . }}</p>{{ end }}
  </header>
  <div class="page-content prose">
    {{ .Content }}
  </div>
</article>
{{ end }}
